<style>
:root {
--bg:#0a0a0f; --surface:#12121a; --surface2:#1a1a26;
--border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.18);
--text:#f0f0f8; --text2:rgba(240,240,248,0.55); --text3:rgba(240,240,248,0.28);
--accent:#7c6af7; --accent2:#a594ff;
--green:#4ade80; --pink:#f472b6; --amber:#fbbf24; --red:#f87171;
--font-d:'Paperlogy',sans-serif; --font-b:'Paperlogy',sans-serif;
--r:14px; --r-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);min-height:100vh;}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;}
.login-card{background:var(--surface);border:.5px solid var(--border2);border-radius:var(--r);padding:2.5rem;width:100%;max-width:360px;text-align:center;}
.login-logo{font-family:var(--font-d);font-size:20px;font-weight:700;color:var(--accent2);margin-bottom:.5rem;}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:2rem;}
.login-input{width:100%;background:var(--surface2);border:.5px solid var(--border2);border-radius:var(--r-sm);padding:12px 16px;font-size:15px;font-family:var(--font-b);color:var(--text);outline:none;text-align:center;letter-spacing:4px;margin-bottom:12px;transition:border-color .2s;}
.login-input:focus{border-color:var(--accent);}
.login-btn{width:100%;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:var(--r-sm);font-size:15px;font-weight:500;cursor:pointer;font-family:var(--font-b);transition:all .2s;}
.login-btn:hover{background:var(--accent2);}
.login-btn:disabled{opacity:.5;cursor:not-allowed;}
.login-err{font-size:12px;color:var(--red);margin-top:8px;display:none;line-height:1.5;}
.login-lock{font-size:12px;color:var(--amber);margin-top:8px;display:none;}
.hdr{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.75rem;background:rgba(10,10,15,.92);backdrop-filter:blur(20px);border-bottom:.5px solid var(--border);z-index:100;}
.logo{font-family:var(--font-d);font-size:16px;font-weight:700;color:var(--accent2);}
.logo span{color:var(--text3);font-weight:400;font-size:13px;}
.hdr-right{display:flex;align-items:center;gap:12px;}
.hdr-stat{font-family:var(--font-d);font-size:11px;color:var(--text3);}
.logout-btn{font-size:12px;color:var(--text2);cursor:pointer;padding:5px 13px;border:.5px solid var(--border);border-radius:20px;background:none;transition:all .2s;}
.logout-btn:hover{border-color:var(--red);color:var(--red);}
.admin{display:none;padding-top:66px;}
.admin.active{display:block;}
.container{max-width:1100px;margin:0 auto;padding:1.5rem;}
.tabs{display:flex;gap:4px;margin-bottom:1.5rem;background:var(--surface);border-radius:var(--r-sm);padding:4px;border:.5px solid var(--border);}
.tab{flex:1;padding:9px;text-align:center;font-size:13px;cursor:pointer;border-radius:6px;color:var(--text2);transition:all .2s;}
.tab.active{background:var(--accent);color:#fff;font-weight:500;}
.tab-content{display:none;}
.tab-content.active{display:block;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem;}
.stat-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);padding:1.25rem;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 0% 0%,rgba(124,106,247,.08) 0%,transparent 70%);pointer-events:none;}
.stat-label{font-size:10px;color:var(--text3);font-family:var(--font-d);letter-spacing:1px;margin-bottom:10px;}
.stat-val{font-family:var(--font-d);font-size:2.2rem;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1;}
.stat-sub{font-size:12px;color:var(--text2);}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem;}
.chart-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);padding:1.25rem;}
.chart-title{font-size:13px;font-weight:500;margin-bottom:1rem;color:var(--text2);}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.bar-label{font-size:11px;color:var(--text2);min-width:70px;text-align:right;}
.bar-wrap{flex:1;height:20px;background:var(--surface2);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width 1s ease;display:flex;align-items:center;padding-left:8px;}
.bar-val{font-size:10px;font-family:var(--font-d);color:#fff;white-space:nowrap;}
.table-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.search-input{background:var(--surface2);border:.5px solid var(--border2);border-radius:var(--r-sm);padding:8px 14px;font-size:13px;color:var(--text);outline:none;transition:border-color .2s;font-family:var(--font-b);flex:1;min-width:180px;}
.search-input:focus{border-color:var(--accent);}
.sort-btn{background:transparent;color:var(--text2);border:.5px solid var(--border);padding:7px 14px;border-radius:var(--r-sm);font-size:12px;cursor:pointer;font-family:var(--font-b);transition:all .2s;}
.sort-btn.active,.sort-btn:hover{border-color:var(--accent);color:var(--accent2);}
.table-wrap{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);overflow:hidden;}
.table-head{display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr 1fr 80px;gap:0;background:var(--surface2);padding:.65rem 1rem;font-size:11px;color:var(--text3);font-family:var(--font-d);letter-spacing:.5px;}
.member-row{display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr 1fr 80px;gap:0;padding:.75rem 1rem;border-top:.5px solid var(--border);align-items:center;transition:background .15s;}
.member-row:hover{background:var(--surface2);}
.member-name{font-size:14px;font-weight:500;color:var(--text);}
.member-code{font-family:var(--font-d);font-size:12px;color:var(--accent2);}
.member-mbti{font-family:var(--font-d);font-size:12px;color:var(--text2);}
.member-date{font-size:11px;color:var(--text3);}
.member-score{font-family:var(--font-d);font-size:12px;}
.del-btn{background:transparent;color:var(--text3);border:.5px solid var(--border);padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;transition:all .2s;}
.del-btn:hover{border-color:var(--red);color:var(--red);}
.empty-msg{text-align:center;padding:3rem;font-size:13px;color:var(--text3);}
.q-editor{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);overflow:hidden;}
.q-editor-head{display:grid;grid-template-columns:40px 1fr 120px 80px;padding:.65rem 1rem;background:var(--surface2);font-size:11px;color:var(--text3);font-family:var(--font-d);}
.q-editor-row{display:grid;grid-template-columns:40px 1fr 120px 80px;padding:.85rem 1rem;border-top:.5px solid var(--border);align-items:center;gap:8px;}
.q-num-badge{font-family:var(--font-d);font-size:11px;color:var(--text3);}
.q-text-input{background:var(--surface2);border:.5px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--text);outline:none;font-family:var(--font-b);width:100%;transition:border-color .2s;}
.q-text-input:focus{border-color:var(--accent);}
.q-type-badge{font-size:11px;padding:2px 9px;border-radius:20px;font-family:var(--font-d);text-align:center;}
.type-binary{background:rgba(55,138,221,.15);color:#378ADD;}
.type-multi{background:rgba(74,222,128,.12);color:#4ade80;}
.type-scale{background:rgba(251,191,36,.12);color:#fbbf24;}
.type-mbti{background:rgba(165,148,255,.12);color:#a594ff;}
.save-q-btn{background:var(--accent);color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:var(--font-b);transition:all .2s;white-space:nowrap;}
.save-q-btn:hover{background:var(--accent2);}
.save-q-btn.saved{background:#4ade80;color:#052e16;}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.section-title-a{font-size:15px;font-weight:500;}
.section-sub-a{font-size:12px;color:var(--text2);}
.refresh-btn{background:transparent;color:var(--text2);border:.5px solid var(--border);padding:6px 14px;border-radius:var(--r-sm);font-size:12px;cursor:pointer;font-family:var(--font-b);transition:all .2s;}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent2);}
.csv-btn{background:transparent;color:var(--green);border:.5px solid rgba(74,222,128,.35);padding:6px 14px;border-radius:var(--r-sm);font-size:12px;cursor:pointer;font-family:var(--font-b);transition:all .2s;}
.csv-btn:hover{background:rgba(74,222,128,.08);border-color:var(--green);}
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,15,.7);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:1rem;}
.loading-overlay.active{display:flex;}
.spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-text{font-family:var(--font-d);font-size:12px;color:var(--text2);}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:9px 18px;border-radius:40px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;align-items:center;justify-content:center;}
.modal-overlay.active{display:flex;}
.modal{background:var(--surface);border:.5px solid var(--border2);border-radius:var(--r);padding:2rem;max-width:360px;width:90%;text-align:center;}
.modal-title{font-size:16px;font-weight:500;margin-bottom:.5rem;}
.modal-sub{font-size:13px;color:var(--text2);margin-bottom:1.5rem;line-height:1.6;}
.modal-btns{display:flex;gap:8px;justify-content:center;}
.modal-cancel{background:transparent;color:var(--text2);border:.5px solid var(--border2);padding:9px 20px;border-radius:var(--r-sm);cursor:pointer;font-family:var(--font-b);font-size:13px;}
.modal-confirm{background:var(--red);color:#fff;border:none;padding:9px 20px;border-radius:var(--r-sm);cursor:pointer;font-family:var(--font-b);font-size:13px;}
@media(max-width:700px){
.stat-grid{grid-template-columns:1fr 1fr;}
.chart-grid{grid-template-columns:1fr;}
.table-head,.member-row{grid-template-columns:1.5fr 1fr 1fr 60px;}
.table-head .h-mbti,.table-head .h-date,.member-mbti,.member-date{display:none;}
}
</style>
</head>

<script>
// ━━━ 보안 설정 ━━━
// 비밀번호: SHA-256(salt + pw) — 소스에 평문 비밀번호 없음
const PW_HASH = '8df8a6a9ed7cbeb39919c79a6381d257611f1bbb39525dd50e53d91b0bcc8c62';
const PW_SALT = '30m-admin-2026';
const SESSION_KEY = '_30m_adm';
const SESSION_TTL = 8 * 60 * 60 * 1000; // 8시간
const MAX_ATTEMPTS = 5;
const LOCK_DURATION = 10 * 60 * 1000; // 10분

// SHA-256 해시 (Web Crypto API)
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// 세션 저장 (만료시간 포함)
function saveSession() {
  const token = { ts: Date.now(), exp: Date.now() + SESSION_TTL };
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(token));
}

function isSessionValid() {
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (!raw) return false;
    const token = JSON.parse(raw);
    if (Date.now() > token.exp) { sessionStorage.removeItem(SESSION_KEY); return false; }
    return true;
  } catch { return false; }
}

// 잠금 상태 확인
function getLockState() {
  try {
    const raw = sessionStorage.getItem('_30m_lock');
    if (!raw) return { locked: false, attempts: 0 };
    const s = JSON.parse(raw);
    if (s.lockUntil && Date.now() > s.lockUntil) {
      sessionStorage.setItem('_30m_lock', JSON.stringify({ attempts: 0 }));
      return { locked: false, attempts: 0 };
    }
    return s;
  } catch { return { locked: false, attempts: 0 }; }
}

function recordFailure() {
  const s = getLockState();
  const attempts = (s.attempts || 0) + 1;
  const newState = { attempts };
  if (attempts >= MAX_ATTEMPTS) newState.lockUntil = Date.now() + LOCK_DURATION;
  sessionStorage.setItem('_30m_lock', JSON.stringify(newState));
  return newState;
}

function resetLock() {
  sessionStorage.removeItem('_30m_lock');
}

// ━━━ LOGIN ━━━
async function doLogin() {
  const lock = getLockState();
  if (lock.lockUntil && Date.now() < lock.lockUntil) {
    const remain = Math.ceil((lock.lockUntil - Date.now()) / 60000);
    document.getElementById('login-lock').style.display = 'block';
    document.getElementById('login-lock').textContent = `⚠️ 너무 많이 시도했어요. ${remain}분 후 다시 시도해주세요.`;
    return;
  }

  const pw = document.getElementById('pw-input').value;
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = '확인 중...';

  const hash = await sha256(PW_SALT + pw);

  if (hash === PW_HASH) {
    resetLock();
    saveSession();
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('admin-hdr').style.display = 'flex';
    document.getElementById('admin-page').classList.add('active');
    loadData();
  } else {
    const state = recordFailure();
    const remaining = MAX_ATTEMPTS - state.attempts;
    const errEl = document.getElementById('login-err');
    errEl.style.display = 'block';
    if (state.lockUntil) {
      errEl.textContent = '';
      document.getElementById('login-lock').style.display = 'block';
      document.getElementById('login-lock').textContent = `⚠️ ${MAX_ATTEMPTS}회 실패. 10분간 잠겨요.`;
    } else {
      errEl.textContent = `비밀번호가 틀렸어요. (${remaining}회 남음)`;
    }
    document.getElementById('pw-input').value = '';

const QS_META = [
{type:'mbti',w:1.5,optsLen:2},{type:'mbti',w:1.5,optsLen:2},{type:'mbti',w:1.5,optsLen:2},{type:'mbti',w:1.5,optsLen:2},

{type:'single',w:1.0,optsLen:5},{type:'multi',w:1.0,max:2,optsLen:6},{type:'single',w:1.0,optsLen:4},{type:'single',w:1.8,optsLen:4},
{type:'multi',w:1.0,max:2,optsLen:5},{type:'single',w:1.8,optsLen:4},{type:'single',w:1.2,optsLen:4},{type:'multi',w:1.0,max:3,optsLen:10},
{type:'multi',w:1.0,max:3,optsLen:11},{type:'multi',w:1.0,max:3,optsLen:12},{type:'single',w:1.0,optsLen:5},{type:'single',w:1.0,optsLen:4},
{type:'multi',w:1.0,max:2,optsLen:7},{type:'single',w:1.0,optsLen:4},{type:'multi',w:1.0,max:2,optsLen:7},{type:'single',w:1.0,optsLen:7},
{type:'multi',w:1.0,max:2,optsLen:7},{type:'multi',w:1.0,max:3,optsLen:12},{type:'single',w:1.0,optsLen:5},{type:'single',w:1.0,optsLen:4},

];

function deserializeAnswersAdmin(raw){
  return (raw||[]).map(a=>{
    if(a.type==='multi'){try{return JSON.parse(a.val||'[]');}catch{return [];}}
    return a.val;
  });
}

function matchScoreAdmin(a1,a2){
  let total=0,weight=0;
  QS_META.forEach((q,i)=>{
    const v1=a1[i],v2=a2[i];
    if(v1==null||v2==null)return;
    const w=q.w||1;let score=0;
    if(q.type==='mbti'||q.type==='binary'){score=v1===v2?1:0;}
    else if(q.type==='single'){const max=q.optsLen-1;score=max===0?1:1-Math.abs(v1-v2)/max;}
    else if(q.type==='multi'){const arr1=Array.isArray(v1)?v1:[],arr2=Array.isArray(v2)?v2:[];const s1=new Set(arr1),s2=new Set(arr2);const inter=[...s1].filter(x=>s2.has(x)).length;const union=new Set([...arr1,...arr2]).size;score=union>0?inter/union:0;}
    total+=score*w;weight+=w;
  });
  return weight>0?Math.round((total/weight)*100):0;
}

const typeClass={binary:'type-binary',single:'type-binary',multi:'type-multi',scale:'type-scale',mbti:'type-mbti'};

let allMembers=[],sortMode='date',pendingDeleteId=null,pendingDeleteName='';

async function waitDb(ms=8000){
  if(window._adb&&window._adb.db)return true;
  const start=Date.now();
  while(Date.now()-start<ms){await new Promise(r=>setTimeout(r,100));if(window._adb&&window._adb.db)return true;}
  return false;
}

async function loadData(){
  setLoad(true,'데이터 불러오는 중...');
  const ok=await waitDb();
  if(!ok){setLoad(false);showToast('Firebase 연결 실패');return;}
  const {db,collection,getDocs}=window._adb;
  try{
    const snap=await getDocs(collection(db,'users'));
    allMembers=[];
    snap.forEach(d=>{
      const data=d.data();
      allMembers.push({docId:d.id,id:d.id,nickname:data.nickname||'익명',codeId:data.codeId||'----',mbti:data.mbti||'----',createdAt:data.createdAt?.toDate?.()||null,answers:data.answers||[],parsedAnswers:deserializeAnswersAdmin(data.answers||[])});
    });
    allMembers.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    setLoad(false);
    renderDashboard();renderMembers();
    document.getElementById('hdr-stat').textContent=`총 ${allMembers.length}명 측정`;
  }catch(e){setLoad(false);showToast('데이터 로드 실패: '+e.message);}
}

function animateCount(id,target){
  const el=document.getElementById(id);if(!el)return;
  if(target===0){el.textContent='0';return;}
  const step=Math.ceil(target/(800/16));let current=0;
  const timer=setInterval(()=>{current=Math.min(current+step,target);el.textContent=current;if(current>=target)clearInterval(timer);},16);
}

function renderDashboard(){
  const total=allMembers.length;
  animateCount('st-total',total);
  const today=new Date();
  const todayCount=allMembers.filter(m=>{if(!m.createdAt)return false;const d=new Date(m.createdAt);return d.getFullYear()===today.getFullYear()&&d.getMonth()===today.getMonth()&&d.getDate()===today.getDate();}).length;
  animateCount('st-today',todayCount);
  const mbtiMap={};
  allMembers.forEach(m=>{const mbti=(m.mbti||'').trim();if(mbti&&mbti!=='----')mbtiMap[mbti]=(mbtiMap[mbti]||0)+1;});
  const mbtiEntries=Object.entries(mbtiMap).sort((a,b)=>b[1]-a[1]);
  const topMbti=mbtiEntries[0];
  document.getElementById('st-mbti').textContent=topMbti?topMbti[0]:(total>0?'집계중':'-');
  const validMembers=allMembers.filter(m=>m.parsedAnswers&&m.parsedAnswers.length===30&&m.parsedAnswers.every(a=>a!=null));
  if(validMembers.length>=2){
    let matchSum=0,matchCnt=0;
    for(let i=0;i<validMembers.length;i++){for(let j=i+1;j<validMembers.length;j++){matchSum+=matchScoreAdmin(validMembers[i].parsedAnswers,validMembers[j].parsedAnswers);matchCnt++;}}
    const avg=matchCnt>0?Math.round(matchSum/matchCnt):0;
    document.getElementById('st-avg').textContent=avg+'%';
  }else{document.getElementById('st-avg').textContent=total>0?'집계중':'-';}
  const mbtiEl=document.getElementById('mbti-chart');
  if(mbtiEntries.length===0){mbtiEl.innerHTML=`<div class="empty-msg" style="padding:1.5rem;font-size:12px;color:var(--text3)">${total===0?'아직 참여자가 없어요':'MBTI 데이터를 불러오는 중'}</div>`;}
  else{const max=mbtiEntries[0][1];const colors=['#7c6af7','#4ade80','#2dd4bf','#f472b6','#fbbf24','#fb923c','#a594ff','#86efac'];mbtiEl.innerHTML=mbtiEntries.slice(0,8).map(([mbti,cnt],i)=>`<div class="bar-row"><div class="bar-label">${mbti}</div><div class="bar-wrap"><div class="bar-fill" style="width:0%;background:${colors[i%colors.length]}" data-w="${Math.round(cnt/max*100)}"><span class="bar-val">${cnt}명</span></div></div></div>`).join('');setTimeout(()=>{mbtiEl.querySelectorAll('.bar-fill').forEach(el=>el.style.width=el.dataset.w+'%');},100);}
  const tierCounts=[0,0,0,0,0];
  const tierDefs=[{label:'90% 이상',color:'#7c6af7'},{label:'75~89%',color:'#4ade80'},{label:'55~74%',color:'#2dd4bf'},{label:'35~54%',color:'#fbbf24'},{label:'34% 이하',color:'#fb923c'}];
  if(validMembers.length>=2){
    for(let i=0;i<validMembers.length;i++){for(let j=i+1;j<validMembers.length;j++){const sc=matchScoreAdmin(validMembers[i].parsedAnswers,validMembers[j].parsedAnswers);if(sc>=90)tierCounts[0]++;else if(sc>=75)tierCounts[1]++;else if(sc>=55)tierCounts[2]++;else if(sc>=35)tierCounts[3]++;else tierCounts[4]++;}}
  }
  const tierTotal=tierCounts.reduce((a,b)=>a+b,0);
  document.getElementById('match-chart').innerHTML=tierDefs.map((t,i)=>{const cnt=tierCounts[i];const pct=tierTotal>0?Math.round(cnt/tierTotal*100):0;return`<div class="bar-row"><div class="bar-label">${t.label}</div><div class="bar-wrap"><div class="bar-fill" style="width:0%;background:${t.color}" data-w="${pct}">${cnt>0?`<span class="bar-val">${cnt}쌍 (${pct}%)</span>`:''}</div></div></div>`;}).join('');
  setTimeout(()=>{document.querySelectorAll('#match-chart .bar-fill').forEach(el=>el.style.width=el.dataset.w+'%');},150);
  document.getElementById('member-count-label').textContent=`전체 ${total}명 측정 완료`;
}

function setSort(mode){sortMode=mode;document.getElementById('sort-date').classList.toggle('active',mode==='date');document.getElementById('sort-name').classList.toggle('active',mode==='name');renderMembers();}

function renderMembers(){
  const q=document.getElementById('search-input').value.toLowerCase();
  let list=allMembers.filter(m=>m.nickname.toLowerCase().includes(q)||m.codeId.toLowerCase().includes(q));
  if(sortMode==='name')list=[...list].sort((a,b)=>a.nickname.localeCompare(b.nickname));
  else list=[...list].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const el=document.getElementById('member-list');
  if(list.length===0){el.innerHTML=`<div class="empty-msg">검색 결과가 없어요</div>`;return;}
  el.innerHTML=list.map(m=>{const dateStr=m.createdAt?m.createdAt.toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-';return`<div class="member-row"><div><div class="member-name">${m.nickname}</div></div><div class="member-code">${m.codeId}</div><div class="member-mbti">${m.mbti}</div><div class="member-date">${dateStr}</div><div class="member-score" style="color:#a594ff">-</div><div><button class="del-btn" onclick="askDelete('${m.docId}','${m.nickname}')">삭제</button></div></div>`;}).join('');
}

function askDelete(id,name){pendingDeleteId=id;pendingDeleteName=name;document.getElementById('del-modal-sub').innerHTML=`<b>${name}</b>님의 측정 데이터를 삭제할까요?<br>삭제 후 복구가 불가능해요.`;document.getElementById('del-modal').classList.add('active');}
function closeModal(){document.getElementById('del-modal').classList.remove('active');pendingDeleteId=null;}

async function confirmDelete(){
  if(!pendingDeleteId)return;
  const targetId=pendingDeleteId,targetName=pendingDeleteName;
  closeModal();setLoad(true,'삭제 중...');
  const ok=await waitDb();
  if(!ok||!window._adb||!window._adb.db){setLoad(false);showToast('Firebase 연결 실패');return;}
  const {db,deleteDoc,doc}=window._adb;
  try{await deleteDoc(doc(db,'users',targetId));allMembers=allMembers.filter(m=>m.docId!==targetId);setLoad(false);showToast(`${targetName}님 삭제 완료`);renderDashboard();renderMembers();}
  catch(e){setLoad(false);showToast('삭제 실패: '+e.message);}
}

function renderQuestions(){
  const saved=JSON.parse(localStorage.getItem('admin_qs')||'{}');
  const el=document.getElementById('q-list');
  el.innerHTML=QS_ADMIN.map(q=>{const txt=saved[q.n]||q.text;return`<div class="q-editor-row"><div class="q-num-badge">Q${q.n}<br><span style="color:var(--text3);font-size:9px">${q.cat}</span></div><input class="q-text-input" id="qt-${q.n}" value="${txt.replace(/"/g,'&quot;')}" /><div class="q-type-badge ${typeClass[q.type]}">${typeLabel[q.type]}</div><button class="save-q-btn" id="qsave-${q.n}" onclick="saveQ(${q.n})">저장</button></div>`;}).join('');
}

function saveQ(n){const val=document.getElementById(`qt-${n}`).value.trim();if(!val){showToast('문항 내용을 입력해주세요');return;}const saved=JSON.parse(localStorage.getItem('admin_qs')||'{}');saved[n]=val;localStorage.setItem('admin_qs',JSON.stringify(saved));const btn=document.getElementById(`qsave-${n}`);btn.textContent='저장됨 ✓';btn.classList.add('saved');setTimeout(()=>{btn.textContent='저장';btn.classList.remove('saved');},2000);showToast(`Q${n} 문항 저장 완료`);}

function switchTab(name){document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['dashboard','members','questions'][i]===name));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.getElementById('tab-'+name).classList.add('active');if(name==='questions')renderQuestions();}

function setLoad(on,msg=''){document.getElementById('loading').classList.toggle('active',on);if(msg)document.getElementById('spin-text').textContent=msg;}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}

// ━━━ CSV 내보내기 ━━━
function exportCSV(){
  if(allMembers.length===0){showToast('내보낼 데이터가 없어요');return;}

  const q=document.getElementById('search-input').value.toLowerCase();
  let list=allMembers.filter(m=>m.nickname.toLowerCase().includes(q)||m.codeId.toLowerCase().includes(q));
  if(sortMode==='name')list=[...list].sort((a,b)=>a.nickname.localeCompare(b.nickname));
  else list=[...list].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  const headers=['번호','닉네임','코드ID','MBTI','참여일시'];
  const rows=list.map((m,i)=>{
    const date=m.createdAt
      ? m.createdAt.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})
      : '-';
    return [i+1, m.nickname, m.codeId, m.mbti, date];
  });

  const csv=[headers,...rows]
    .map(row=>row.map(v=>(`${v}`.includes(',')||`${v}`.includes('"')||`${v}`.includes('\n'))
      ? `"${`${v}`.replace(/"/g,'""')}"` : `${v}`)
    .join(','))
    .join('\n');

  // BOM 추가 (Excel 한글 깨짐 방지)
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const now=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\. /g,'').replace('.','');
  a.href=url;a.download=`30M_측정자_${now}.csv`;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  showToast(`${list.length}명 데이터를 CSV로 내보냈어요`);
}
